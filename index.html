<title>alcove. listen</title>
<script>
/* same palette family as alcove. */
const TH = {
  linen:    {l:'linen',          bg:'#f5f0e8', fg:'#302d29', dim:'#7d6654', line:'#e0d7c7', tile:'#ebe4d6', ac:'#7d6452', on:'#f5f0e8', st:'#302d29', dn:'#a23a22'},
  cotton:   {l:'cotton',         bg:'#ffffff', fg:'#1d1d1f', dim:'#6e6e73', line:'#e3e3e8', tile:'#f2f2f5', ac:'#48484d', on:'#ffffff', st:'#1d1d1f', dn:'#c4352b'},
  batter:   {l:'golden batter',  bg:'#e8d1a7', fg:'#442d1c', dim:'#7a6246', line:'#d0b88a', tile:'#f0dfbc', ac:'#84592b', on:'#fbf1dc', st:'#442d1c', dn:'#8f2a12'},
  cocoa:    {l:'cowhide cocoa',  bg:'#442d1c', fg:'#ecdcc0', dim:'#b29c82', line:'#5a4030', tile:'#523827', ac:'#9d9167', on:'#1f150b', st:'#442d1c', dn:'#ff8a76'},
  graphite: {l:'graphite',       bg:'#1c1c1e', fg:'#dcdcde', dim:'#98989d', line:'#3a3a3c', tile:'#2a2a2c', ac:'#e8d1a7', on:'#2a1d10', st:'#1c1c1e', dn:'#ff6b6b'},
  black:    {l:'black',          bg:'#000000', fg:'#d6d6d6', dim:'#8a8a8e', line:'#2a2a2c', tile:'#121212', ac:'#e8d1a7', on:'#2a1d10', st:'#000000', dn:'#ff6b6b'}
};
document.head.insertAdjacentHTML('beforeend', '<style>' + Object.entries(TH).map(([k, t]) =>
  `body[data-theme=${k}]{--bg:${t.bg};--fg:${t.fg};--dim:${t.dim};--line:${t.line};--tile:${t.tile};--accent:${t.ac};--on-accent:${t.on};--status:${t.st};--danger:${t.dn}}`).join('') + '</style>');
</script>
<style>
@font-face{font-family:'Oblata Display';src:url(oblata.woff) format('woff');font-weight:400;font-style:normal;font-display:swap}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg)}
body{font:16px/1.4 -apple-system,system-ui,"Helvetica Neue",sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior:none}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--status);z-index:100;pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.view{position:fixed;inset:0;background:var(--bg)}
.wm{font-family:'Oblata Display',ui-rounded,ui-serif,Georgia,serif;font-weight:400;font-size:44px;margin:0;line-height:1.05;font-synthesis:none}
.wm small{font:500 12px -apple-system,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-left:8px;vertical-align:baseline}

/* library */
#lib{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 40px)}
#lib header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;gap:10px}
.actions{display:flex;gap:16px;font-size:16px}.dim{color:var(--dim)}
#shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 18px;align-items:start}
@media (min-width:640px){#shelf{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width:1000px){#shelf{grid-template-columns:repeat(6,minmax(0,1fr))}}
.tile{display:block;text-align:left;width:100%;min-width:0}
.cover{position:relative;width:100%;border-radius:4px;overflow:hidden;background:var(--tile);border:1px solid var(--line)}
.cover::before{content:"";display:block;padding-top:100%}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px;font:600 17px/1.25 ui-serif,Georgia,serif;overflow:hidden}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.2)}.bar i{display:block;height:100%;background:var(--accent)}
.t{margin-top:9px;font-size:15px;font-weight:500;line-height:1.25;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.a{margin-top:2px;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rm{display:none;margin-top:6px;font-size:14px;color:var(--danger)}body.editing .rm{display:block}
#empty{margin-top:20vh;text-align:center;color:var(--dim);line-height:1.5}
#empty p{margin:0 0 22px;font-size:17px}#empty .wm{font-size:27px;color:var(--fg);margin-bottom:6px}
#empty button{color:var(--accent);border:1px solid var(--accent);border-radius:22px;padding:11px 24px;font-size:16px}

/* player */
#player{display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 24px calc(env(safe-area-inset-bottom) + 18px)}
#player>*{width:100%;max-width:460px}
#pTop{display:flex;justify-content:space-between;font-size:15px;flex:none}
#art{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px 0}
#art img,#art .ph{max-width:100%;max-height:100%;border-radius:6px;box-shadow:0 10px 34px rgba(0,0,0,.22);border:1px solid var(--line)}
#art .ph{width:min(70vw,340px);aspect-ratio:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:var(--tile);font:600 22px/1.25 ui-serif,Georgia,serif}
#pTitle{font:600 19px/1.25 ui-serif,Georgia,serif;text-align:center;margin:0;flex:none}
#pAuth{text-align:center;font-size:14px;color:var(--dim);margin-top:3px;flex:none}
#pChap{text-align:center;font-size:14px;color:var(--accent);margin:10px 0 2px;min-height:20px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#seek{width:100%;-webkit-appearance:none;appearance:none;height:30px;background:transparent;margin:0;flex:none}
#seek::-webkit-slider-runnable-track{height:2px;background:var(--line);border-radius:2px}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);margin-top:-9px}
#seek::-moz-range-track{height:2px;background:var(--line)}#seek::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--accent)}
#times{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;flex:none}
#ctl{display:flex;align-items:center;justify-content:space-between;margin:10px 0 6px;flex:none}
#ctl button{width:54px;height:54px;display:flex;align-items:center;justify-content:center;border-radius:50%}
#ctl svg{width:28px;height:28px}
#ctl #pp{width:76px;height:76px;border:1.5px solid var(--line)}#ctl #pp svg{width:34px;height:34px}
#opts{display:flex;justify-content:space-around;flex:none;border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
#opts button{padding:10px 8px;font-size:15px;color:var(--dim);min-width:80px}#opts button.on{color:var(--accent)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,0);transition:background .22s}
#sheet.open{background:rgba(0,0,0,.5)}
#panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:78vh;display:flex;flex-direction:column;background:var(--bg);border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(100%);transition:transform .24s ease}
#sheet.open #panel{transform:none}
#panel h2{margin:0;padding:18px 22px 10px;font-size:15px;font-weight:500;color:var(--dim)}
#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom) + 14px)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:13px 22px;font-size:16px;line-height:1.3;border-top:1px solid var(--line)}
.row.cur{color:var(--accent);font-weight:600}.row .n{flex:none;color:var(--dim);font-size:13px;font-weight:400;font-variant-numeric:tabular-nums}
.row>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis}
.row .sw{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);flex:none}
.note{padding:12px 22px 4px;font-size:12px;color:var(--dim);line-height:1.45}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 28px);z-index:30;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:22px;font-size:14px;max-width:86vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#sheet,#panel{transition:none}}
</style>
</head>
<body data-theme="linen">

<div id="lib" class="view">
  <header>
    <h1 class="wm">alcove.<small>listen</small></h1>
    <div class="actions"><button id="editBtn" class="dim" hidden>edit</button><button id="setBtn" class="dim">settings</button><button id="addBtn">add</button></div>
  </header>
  <main id="shelf"></main>
  <div id="empty" hidden>
    <div class="wm">nothing here yet.</div>
    <p>Add audiobooks (m4b, mp4, m4a, mp3 and more) from the Files app.</p>
    <button id="addBtn2">add audiobooks</button>
  </div>
  <input id="file" type="file" multiple hidden>
  <input id="pfile" type="file" accept="application/json,.json" hidden>
</div>

<div id="player" class="view" hidden>
  <div id="pTop"><button id="backBtn">library</button><span></span></div>
  <div id="art"></div>
  <h2 id="pTitle"></h2><div id="pAuth"></div><div id="pChap"></div>
  <input id="seek" type="range" min="0" max="1" step="any" value="0" aria-label="position">
  <div id="times"><span id="tNow">0:00</span><span id="tLeft">-0:00</span></div>
  <div id="ctl">
    <button id="bPrev" aria-label="previous chapter"></button>
    <button id="bBack" aria-label="back 15 seconds"></button>
    <button id="pp" aria-label="play or pause"></button>
    <button id="bFwd" aria-label="forward 30 seconds"></button>
    <button id="bNext" aria-label="next chapter"></button>
  </div>
  <div id="opts"><button id="oRate">1×</button><button id="oSleep">sleep</button><button id="oChap">chapters</button></div>
</div>

<div id="sheet" hidden><div id="panel"><h2 id="sheetTitle"></h2><div id="sheetBody"></div></div></div>
<div id="toast"></div>

<script src="m4b.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}` : `${m}:${String(x).padStart(2, '0')}`; };
const sv = (a, ex) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${a}${ex || ''}</svg>`;
const num = n => `<text x="12" y="16.2" font-size="7.5" text-anchor="middle" fill="currentColor" stroke="none" font-family="-apple-system,system-ui,sans-serif" font-weight="600">${n}</text>`;
const IC = {
  back: sv('<path d="M12 5a8 8 0 1 1-7.5 5.2"/><path d="M12 1.5L8.5 5 12 8.5"/>', num(15)),
  fwd:  sv('<path d="M12 5a8 8 0 1 0 7.5 5.2"/><path d="M12 1.5L15.5 5 12 8.5"/>', num(30)),
  play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><rect x="6.5" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="13.5" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>',
  prev: sv('<path d="M6 5v14"/><path d="M18 6l-9 6 9 6z" fill="currentColor"/>'),
  next: sv('<path d="M18 5v14"/><path d="M6 6l9 6-9 6z" fill="currentColor"/>')
};
$('#bBack').innerHTML = IC.back; $('#bFwd').innerHTML = IC.fwd; $('#bPrev').innerHTML = IC.prev; $('#bNext').innerHTML = IC.next;

/* settings */
const SKEY = 'alcove.listen.settings';
const S = Object.assign({theme: 'linen', rate: 1}, (() => { try { return JSON.parse(localStorage.getItem(SKEY) || '{}'); } catch (e) { return {}; } })());
if (!TH[S.theme]) S.theme = 'linen';
const saveS = () => { try { localStorage.setItem(SKEY, JSON.stringify(S)); } catch (e) {} };
function applyTheme() { document.body.dataset.theme = S.theme; $('meta[name=theme-color]').content = TH[S.theme].bg; }
applyTheme();
let tt; const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2400); };

/* storage: IndexedDB for books and files, localStorage for listening positions */
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open('alcove-listen', 1);
  r.onupgradeneeded = () => { r.result.createObjectStore('books', {keyPath: 'id'}); r.result.createObjectStore('files'); };
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const tx = async (st, mode, fn) => {
  const db = await dbp;
  return new Promise((res, rej) => {
    const t = db.transaction(st, mode); let r;
    try { r = fn(...st.map(n => t.objectStore(n))); } catch (e) { return rej(e); }
    t.oncomplete = () => res(r && r.result !== undefined ? r.result : r); t.onerror = t.onabort = () => rej(t.error);
  });
};
const pk = id => 'alcove.listen.pos.' + id;
const getPos = id => { try { return JSON.parse(localStorage.getItem(pk(id)) || 'null'); } catch (e) { return null; } };
const setPos = (id, t) => { try { localStorage.setItem(pk(id), JSON.stringify({t, ts: Date.now()})); } catch (e) {} };
const bookKey = m => [m.title, m.author, Math.round(m.dur || 0)].join('|');

let books = [], B = null, aUrl = null;
const cov = {};
const coverUrl = m => m.cover ? (cov[m.id] = cov[m.id] || URL.createObjectURL(m.cover)) : '';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

/* library */
function renderLib() {
  const list = [...books].sort((a, b) => ((getPos(b.id) || {}).ts || b.added) - ((getPos(a.id) || {}).ts || a.added));
  $('#empty').hidden = !!list.length; $('#editBtn').hidden = !list.length;
  if (!list.length) document.body.classList.remove('editing');
  $('#shelf').innerHTML = '';
  for (const m of list) {
    const p = getPos(m.id), pc = p && m.dur ? Math.min(1, p.t / m.dur) : 0, u = coverUrl(m);
    const el = document.createElement('div');
    el.innerHTML = `<button class="tile"><div class="cover">${u ? `<img src="${u}" alt="">` : `<div class="ph">${esc(m.title)}</div>`}${pc > 0 ? `<div class="bar"><i style="width:${pc * 100}%"></i></div>` : ''}</div>
      <div class="t">${esc(m.title)}</div><div class="a">${esc(m.author || fmt(m.dur))}</div></button><button class="rm">delete</button>`;
    el.firstElementChild.onclick = () => openBook(m.id);
    el.querySelector('.rm').onclick = () => removeBook(m);
    $('#shelf').append(el);
  }
}
async function removeBook(m) {
  if (!confirm('Delete "' + m.title + '" from this device?')) return;
  await tx(['books', 'files'], 'readwrite', (b, f) => { b.delete(m.id); f.delete(m.id); });
  try { localStorage.removeItem(pk(m.id)); } catch (e) {}
  if (cov[m.id]) { URL.revokeObjectURL(cov[m.id]); delete cov[m.id]; }
  books = books.filter(x => x.id !== m.id); renderLib();
}
const probe = f => new Promise(r => {
  const a = new Audio(), u = URL.createObjectURL(f); a.preload = 'metadata';
  a.onloadedmetadata = () => { URL.revokeObjectURL(u); r(isFinite(a.duration) ? a.duration : 0); };
  a.onerror = () => { URL.revokeObjectURL(u); r(0); }; a.src = u;
});
async function addFiles(fl) {
  let n = 0;
  for (const f of fl) {
    try {
      toast('adding ' + f.name + '…');
      let t = {}; try { t = await parseM4B(f); } catch (e) {}
      const dur = t.dur || await probe(f);
      if (!dur) { toast(f.name + " isn't an audio file this browser can play"); continue; }
      const m = {id: uid(), title: (t.title || f.name.replace(/\.[^.]+$/, '')).trim(), author: t.author || '', dur,
        chapters: t.chapters || [], cover: t.cover || null, size: f.size, added: Date.now()};
      await tx(['books', 'files'], 'readwrite', (b, fs) => { b.put(m); fs.put(f, m.id); });
      books.push(m); n++; renderLib();
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    } catch (e) { toast("couldn't add " + f.name + " (is the device full?)"); return; }
  }
  if (n) toast(n === 1 ? 'added' : 'added ' + n + ' books');
}

/* player */
const au = new Audio(); au.preload = 'auto'; au.preservesPitch = true; au.webkitPreservesPitch = true;
let drag = false, lastSave = 0, lastCh = -2, SL = null;
const chapAt = t => { const c = B.chapters; let i = -1; for (let k = 0; k < c.length && c[k].t <= t + .05; k++) i = k; return i; };
const total = () => (B && (B.dur || au.duration)) || 0;

async function openBook(id) {
  const m = books.find(x => x.id === id);
  const f = await tx(['files'], 'readonly', s => s.get(id)).catch(() => null);
  if (!f) return toast('file is missing, please add it again');
  if (B && B.id !== id) saveNow();
  B = m; SL = null; lastCh = -2; $('#toast').classList.remove('on');
  if (aUrl) URL.revokeObjectURL(aUrl);
  au.src = aUrl = URL.createObjectURL(f);
  const p = getPos(id); let start = p ? p.t : 0;
  if (m.dur && start >= m.dur - 3) start = 0;
  au.addEventListener('loadedmetadata', () => {
    if (!m.dur && isFinite(au.duration)) m.dur = au.duration;
    au.currentTime = start; au.playbackRate = S.rate; ui(true);
  }, {once: true});
  const u = coverUrl(m);
  $('#art').innerHTML = u ? `<img src="${u}" alt="">` : `<div class="ph">${esc(m.title)}</div>`;
  $('#pTitle').textContent = m.title; $('#pAuth').textContent = m.author;
  const hc = !!m.chapters.length;
  $('#bPrev').hidden = $('#bNext').hidden = $('#oChap').hidden = !hc;
  $('#lib').hidden = true; $('#player').hidden = false;
  ui(true); setPP();
}
function setPP() { $('#pp').innerHTML = au.paused ? IC.play : IC.pause; }
function ui(force) {
  if (!B) return;
  const t = au.currentTime || 0, d = total(), i = chapAt(t);
  if (!drag) { $('#seek').max = d || 1; $('#seek').value = t; $('#tNow').textContent = fmt(t); }
  $('#tLeft').textContent = '-' + fmt(d - t);
  $('#pChap').textContent = i >= 0 ? B.chapters[i].title : '';
  $('#oRate').textContent = (+S.rate.toFixed(2)) + '×';
  const sl = SL ? (SL.end !== undefined ? 'chapter' : Math.max(1, Math.ceil((SL.at - Date.now()) / 60000)) + 'm') : '';
  $('#oSleep').textContent = sl ? 'sleep ' + sl : 'sleep'; $('#oSleep').classList.toggle('on', !!SL);
  if (i !== lastCh || force) { lastCh = i; msMeta(); }
}
const seek = t => { const d = total(); au.currentTime = Math.max(0, d ? Math.min(d, t) : t); ui(); };
const starts = () => B.chapters.map(c => c.t);
function chapter(dir) {
  const s = starts(), t = au.currentTime, i = chapAt(t);
  if (dir > 0) seek(i + 1 < s.length ? s[i + 1] : total());
  else seek(i >= 0 && t - s[i] > 3 ? s[i] : (s[Math.max(0, i - 1)] || 0));
}
function saveNow() { if (B) { setPos(B.id, au.currentTime || 0); lastSave = Date.now(); } }
function sleepCheck() {
  if (!SL) return;
  if (SL.end !== undefined ? au.currentTime >= SL.end - .3 : Date.now() >= SL.at) { au.pause(); SL = null; ui(); }
}
au.ontimeupdate = () => { ui(); if (Date.now() - lastSave > 5000) saveNow(); sleepCheck(); msPos(); };
au.onpause = () => { saveNow(); setPP(); msPos(); }; au.onplay = () => { setPP(); msPos(); };
au.onended = () => { if (B) setPos(B.id, total()); setPP(); };
au.onerror = () => toast("couldn't play this file");
const toggle = () => { if (!B) return; au.paused ? au.play().catch(() => toast('tap play to start')) : au.pause(); };

$('#pp').onclick = toggle;
$('#bBack').onclick = () => seek(au.currentTime - 15); $('#bFwd').onclick = () => seek(au.currentTime + 30);
$('#bPrev').onclick = () => chapter(-1); $('#bNext').onclick = () => chapter(1);
$('#seek').addEventListener('input', e => { drag = true; $('#tNow').textContent = fmt(+e.target.value); $('#tLeft').textContent = '-' + fmt(total() - e.target.value); });
$('#seek').addEventListener('change', e => { drag = false; seek(+e.target.value); });
$('#backBtn').onclick = () => { saveNow(); $('#player').hidden = true; $('#lib').hidden = false; renderLib(); };
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });
addEventListener('pagehide', saveNow);
addEventListener('keydown', e => {
  if (!B || $('#player').hidden || /INPUT/.test(e.target.tagName) && e.target.type !== 'range') return;
  if (e.key === ' ') { e.preventDefault(); toggle(); }
  else if (e.key === 'ArrowLeft') seek(au.currentTime - 15); else if (e.key === 'ArrowRight') seek(au.currentTime + 30);
});

/* lock screen and headphone controls */
const ms = 'mediaSession' in navigator ? navigator.mediaSession : null;
function msMeta() {
  if (!ms || !B) return;
  const i = chapAt(au.currentTime), u = coverUrl(B);
  try { ms.metadata = new MediaMetadata({title: i >= 0 ? B.chapters[i].title : B.title, artist: B.author || '', album: B.title,
    artwork: u ? [{src: u, sizes: '512x512', type: B.cover.type}] : []}); } catch (e) {}
}
function msPos() {
  const d = total(); if (!ms || !ms.setPositionState || !d || !isFinite(d)) return;
  try { ms.setPositionState({duration: d, position: Math.min(au.currentTime, d), playbackRate: au.playbackRate || 1}); } catch (e) {}
}
if (ms) {
  const h = (a, f) => { try { ms.setActionHandler(a, f); } catch (e) {} };
  h('play', () => au.play()); h('pause', () => au.pause());
  h('seekbackward', d => seek(au.currentTime - (d && d.seekOffset || 15))); h('seekforward', d => seek(au.currentTime + (d && d.seekOffset || 30)));
  h('previoustrack', () => B && B.chapters.length && chapter(-1)); h('nexttrack', () => B && B.chapters.length && chapter(1));
  h('seekto', d => d && d.seekTime != null && seek(d.seekTime));
}

/* sheets */
let sheetT;
function sheet(title, build) {
  $('#sheetTitle').textContent = title; const b = $('#sheetBody'); b.innerHTML = ''; build(b);
  const sh = $('#sheet'); clearTimeout(sheetT); sh.hidden = false; requestAnimationFrame(() => sh.classList.add('open'));
}
function closeSheet() { const sh = $('#sheet'); sh.classList.remove('open'); sheetT = setTimeout(() => sh.hidden = true, 240); }
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
function row(b, label, right, cur, fn) {
  const r = document.createElement('button'); r.className = 'row' + (cur ? ' cur' : '');
  r.innerHTML = `<span>${esc(label)}</span>${right || ''}`; r.onclick = fn; b.append(r); return r;
}
$('#oChap').onclick = () => sheet('chapters', b => {
  const i = chapAt(au.currentTime); let cur;
  B.chapters.forEach((c, k) => { const r = row(b, c.title, `<span class="n">${fmt(c.t)}</span>`, k === i, () => { seek(c.t); closeSheet(); }); if (k === i) cur = r; });
  setTimeout(() => cur && cur.scrollIntoView({block: 'center'}), 260);
});
$('#oRate').onclick = () => sheet('speed', b => [.8, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3].forEach(r =>
  row(b, r + '×', '', r === S.rate, () => { S.rate = r; au.playbackRate = r; saveS(); ui(); closeSheet(); })));
$('#oSleep').onclick = () => sheet('sleep timer', b => {
  row(b, 'off', '', !SL, () => { SL = null; ui(); closeSheet(); });
  [15, 30, 45, 60].forEach(m => row(b, m + ' minutes', '', false, () => { SL = {at: Date.now() + m * 60000}; ui(); closeSheet(); }));
  if (B.chapters.length) row(b, 'end of chapter', '', false, () => {
    const s = starts(), i = chapAt(au.currentTime); SL = {end: i + 1 < s.length ? s[i + 1] : total()}; ui(); closeSheet(); });
});

/* settings, with progress backup so you can move your place between devices */
function exportProgress() {
  const items = books.map(m => ({key: bookKey(m), pos: getPos(m.id)})).filter(x => x.pos);
  const url = URL.createObjectURL(new Blob([JSON.stringify({format: 'alcove-listen-progress', version: 1, items})], {type: 'application/json'}));
  const a = document.createElement('a'); a.href = url; a.download = 'alcove-listen-progress-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}
async function importProgress(f) {
  try {
    const j = JSON.parse(await f.text()); if (j.format !== 'alcove-listen-progress') throw 0;
    let n = 0;
    for (const it of j.items) {
      const m = books.find(x => bookKey(x) === it.key), cur = m && getPos(m.id);
      if (m && (!cur || cur.ts < it.pos.ts)) { localStorage.setItem(pk(m.id), JSON.stringify(it.pos)); n++; }
    }
    renderLib(); toast(n ? 'updated ' + n + (n === 1 ? ' book' : ' books') : 'nothing newer to import');
  } catch (e) { toast("that isn't a progress file"); }
}
$('#setBtn').onclick = () => sheet('settings', b => {
  Object.entries(TH).forEach(([k, t]) => row(b, t.l, `<span class="sw" style="background:${t.bg}"></span>`, k === S.theme, () => { S.theme = k; saveS(); applyTheme(); closeSheet(); }));
  row(b, 'save my place to a file', '', false, () => { exportProgress(); closeSheet(); });
  row(b, 'restore my place from a file', '', false, () => { closeSheet(); $('#pfile').click(); });
  const n = document.createElement('p'); n.className = 'note';
  n.textContent = 'Audiobooks stay on this device. To continue on another device, add the same books there, then restore your place from the file.'; b.append(n);
});
$('#pfile').onchange = e => { if (e.target.files[0]) importProgress(e.target.files[0]); e.target.value = ''; };

/* add, edit, drag and drop */
const pick = () => $('#file').click();
$('#addBtn').onclick = pick; $('#addBtn2').onclick = pick;
$('#file').onchange = e => { const fl = [...e.target.files]; e.target.value = ''; if (fl.length) addFiles(fl); };
$('#editBtn').onclick = () => { const on = document.body.classList.toggle('editing'); $('#editBtn').textContent = on ? 'done' : 'edit'; };
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); const fl = [...(e.dataTransfer ? e.dataTransfer.files : [])]; if (fl.length) addFiles(fl); });

/* start */
tx(['books'], 'readonly', s => s.getAll()).then(r => { books = r || []; renderLib(); }).catch(() => { renderLib(); toast('storage is unavailable in this browser mode'); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
